[project]
name = "scaling-laws-scrna"
version = "1.0.0"
description = "Scaling laws for masked-reconstruction transformers on single-cell RNA-seq data"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "scanpy>=1.9",
  "anndata>=0.10",
  "scvi-tools>=1.3",
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "umap-learn",
  "rich",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
